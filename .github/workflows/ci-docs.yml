name: Documentation CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'AGENTS.md'
      - 'WORKFLOW.md'
      - '.agents/plane-workflow.yml'
      - '.env.example'
      - 'docs/**'
      - 'tools/check_plane_workflow.sh'
      - 'tools/plane_tracker.rb'
      - 'tools/tests/plane_tracker_test.rb'
      - 'tools/ssot_check.sh'
      - 'tools/doc_lint.sh'
  pull_request:
    branches: [ main ]
    paths:
      - 'AGENTS.md'
      - 'WORKFLOW.md'
      - '.agents/plane-workflow.yml'
      - '.env.example'
      - 'docs/**'
      - 'tools/check_plane_workflow.sh'
      - 'tools/plane_tracker.rb'
      - 'tools/tests/plane_tracker_test.rb'
      - 'tools/ssot_check.sh'
      - 'tools/doc_lint.sh'

jobs:
  docs-validation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Make documentation checks executable
      run: chmod +x tools/ssot_check.sh tools/doc_lint.sh tools/check_plane_workflow.sh tools/plane_tracker.rb

    - name: Validate Plane agent workflow wiring
      run: tools/check_plane_workflow.sh

    - name: Run documentation lifecycle and drift lint
      run: tools/doc_lint.sh
      
    - name: Run SSOT integrity check
      run: tools/ssot_check.sh
      
    - name: Check markdown links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'yes'
        folder-path: 'docs/SSOT'
        config-file: '.github/workflows/markdown-link-check-config.json'
        
    - name: Validate OpenAPI spec
      run: npx --yes @apidevtools/swagger-cli@4.0.4 validate docs/SSOT/contracts/api.openapi.yaml
