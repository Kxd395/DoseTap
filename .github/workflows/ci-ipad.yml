name: iPad Dashboard
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ipad-dashboard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipad-tests:
    name: Separate iPad dashboard tests
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate separate project
        run: xcodegen generate --spec ipad/project.yml
      - name: Test separate iPad app
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/ipad-devices.json"
          DASHBOARD_SIM_ID="$(python3 - "$RUNNER_TEMP/ipad-devices.json" <<'PY'
          import json, sys
          devices = json.load(open(sys.argv[1]))['devices']
          candidates = [d['udid'] for runtime, values in devices.items() if 'iOS' in runtime for d in values if d.get('isAvailable') and d['name'].startswith('iPad')]
          if not candidates: raise SystemExit('No available iPad simulator')
          print(candidates[-1])
          PY
          )"
          xcodebuild test -project ipad/DoseTapDashboard.xcodeproj -scheme DoseTapDashboard \
            -destination "platform=iOS Simulator,id=$DASHBOARD_SIM_ID" \
            -derivedDataPath "$RUNNER_TEMP/ipad-dashboard-build" \
            -resultBundlePath "$RUNNER_TEMP/ipad-dashboard.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ipad-dashboard.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-dashboard-test-evidence
          path: |
            ${{ runner.temp }}/ipad-dashboard.log
            ${{ runner.temp }}/ipad-dashboard.xcresult
